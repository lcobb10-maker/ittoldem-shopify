name: Bootstrap Horizon into ITT TOLD'EM development

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-horizon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import official Shopify Horizon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/horizon
          git clone --depth 1 https://github.com/Shopify/horizon.git /tmp/horizon

          git fetch origin ittoldem-development
          git checkout ittoldem-development

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'docs' \
            -exec rm -rf {} +

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='docs' \
            /tmp/horizon/ ./

          mkdir -p docs
          cat > docs/UPSTREAM.md <<'EOF'
          # Upstream Theme

          ITT TOLD'EM storefront development is based on Shopify's official public Horizon theme source:
          https://github.com/Shopify/horizon

          The live Shopify storefront should not be replaced until this development branch is previewed and approved.
          EOF

          git add -A
          if git diff --cached --quiet; then
            echo "No Horizon changes to commit."
          else
            git commit -m "Bootstrap official Shopify Horizon theme"
            git push origin ittoldem-development
          fi
