name: ITT Storefront Validation

on:
  push:
    branches: [ittoldem-commerce-pass, shopify-preview, main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level warning'
          token: ${{ github.token }}
          base: main

  storefront-contract:
    name: Storefront contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate theme structure and connected homepage settings
        run: python scripts/validate_theme.py
