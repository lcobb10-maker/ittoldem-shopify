name: Build ITT Shopify image pickers

on:
  push:
    branches:
      - ittoldem-commerce-pass
    paths:
      - .github/workflows/embed-itt-campaign-images.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ittoldem-commerce-pass

      - name: Replace campaign hacks with native Shopify image pickers
        shell: python
        run: |
          from pathlib import Path
          import json, re

          p = Path('sections/ittoldem-house.liquid')
          text = p.read_text(encoding='utf-8')

          image_expr = {
            "{% render 'itt-campaign-hero' %}": "{{ section.settings.hero_image | image_url: width: 2200 }}",
            "{% render 'itt-campaign-apparel' %}": "{{ section.settings.apparel_image | image_url: width: 1200 }}",
            "{% render 'itt-campaign-flagline' %}": "{{ section.settings.flagline_image | image_url: width: 1200 }}",
            "{% render 'itt-campaign-lab' %}": "{{ section.settings.lab_image | image_url: width: 1200 }}",
            "{% render 'itt-campaign-denim' %}": "{{ section.settings.denim_image | image_url: width: 1200 }}",
            "{% render 'itt-campaign-wehair' %}": "{{ section.settings.wehair_image | image_url: width: 1200 }}",
          }
          for old, new in image_expr.items():
            text = text.replace(old, new)

          # Prevent blank image settings from producing invalid src values.
          text = text.replace(
            '<img src="{{ section.settings.hero_image | image_url: width: 2200 }}" class="itt-hero__media" loading="eager" fetchpriority="high" alt="ITT TOLD\'EM Detroit campaign">',
            '{% if section.settings.hero_image != blank %}{{ section.settings.hero_image | image_url: width: 2200 | image_tag: class: \'itt-hero__media\', loading: \'eager\', fetchpriority: \'high\', alt: "ITT TOLD’EM Detroit campaign" }}{% else %}<div class="itt-hero__media itt-media-placeholder" aria-hidden="true"></div>{% endif %}'
          )
          text = text.replace(
            '<img src="{{ section.settings.apparel_image | image_url: width: 1200 }}" class="itt-card__media" loading="lazy" alt="ITT TOLD\'EM apparel">',
            '{% if section.settings.apparel_image != blank %}{{ section.settings.apparel_image | image_url: width: 1200 | image_tag: class: \'itt-card__media\', loading: \'lazy\', alt: "ITT TOLD’EM apparel" }}{% else %}<div class="itt-card__media itt-media-placeholder" aria-hidden="true"></div>{% endif %}'
          )
          text = text.replace(
            '<img src="{{ section.settings.flagline_image | image_url: width: 1200 }}" class="itt-card__media" loading="lazy" alt="Gym Vibes Only">',
            '{% if section.settings.flagline_image != blank %}{{ section.settings.flagline_image | image_url: width: 1200 | image_tag: class: \'itt-card__media\', loading: \'lazy\', alt: "Gym Vibes Only" }}{% else %}<div class="itt-card__media itt-media-placeholder" aria-hidden="true"></div>{% endif %}'
          )
          text = text.replace(
            '<img src="{{ section.settings.lab_image | image_url: width: 1200 }}" class="itt-card__media" loading="lazy" alt="ITT TOLD\'EM The Lab">',
            '{% if section.settings.lab_image != blank %}{{ section.settings.lab_image | image_url: width: 1200 | image_tag: class: \'itt-card__media\', loading: \'lazy\', alt: "ITT TOLD’EM The Lab" }}{% else %}<div class="itt-card__media itt-media-placeholder" aria-hidden="true"></div>{% endif %}'
          )
          text = text.replace(
            '<img src="{{ section.settings.denim_image | image_url: width: 1200 }}" class="itt-card__media" loading="lazy" alt="ITT TOLD\'EM custom denim">',
            '{% if section.settings.denim_image != blank %}{{ section.settings.denim_image | image_url: width: 1200 | image_tag: class: \'itt-card__media\', loading: \'lazy\', alt: "ITT TOLD’EM custom denim" }}{% else %}<div class="itt-card__media itt-media-placeholder" aria-hidden="true"></div>{% endif %}'
          )
          text = text.replace(
            '<img src="{{ section.settings.hero_image | image_url: width: 2200 }}" class="itt-story__media" loading="lazy" alt="ITT TOLD\'EM Detroit story">',
            '{% if section.settings.hero_image != blank %}{{ section.settings.hero_image | image_url: width: 1800 | image_tag: class: \'itt-story__media\', loading: \'lazy\', alt: "ITT TOLD’EM Detroit story" }}{% endif %}'
          )
          text = text.replace(
            '<img src="{{ section.settings.flagline_image | image_url: width: 1200 }}" class="itt-editorial__media" loading="lazy" alt="GVO FLAGLINE girls flag football">',
            '{% if section.settings.flagline_image != blank %}{{ section.settings.flagline_image | image_url: width: 1600 | image_tag: class: \'itt-editorial__media\', loading: \'lazy\', alt: "GVO FLAGLINE girls flag football" }}{% endif %}'
          )
          text = text.replace(
            '<img src="{{ section.settings.denim_image | image_url: width: 1200 }}" class="itt-editorial__media" loading="lazy" alt="ITT TOLD\'EM custom work and engraved denim">',
            '{% if section.settings.denim_image != blank %}{{ section.settings.denim_image | image_url: width: 1600 | image_tag: class: \'itt-editorial__media\', loading: \'lazy\', alt: "ITT TOLD’EM custom work and engraved denim" }}{% endif %}'
          )
          text = text.replace(
            '<img src="{{ section.settings.wehair_image | image_url: width: 1200 }}" class="itt-editorial__media" loading="lazy" alt="WE HAIR tools and beauty development">',
            '{% if section.settings.wehair_image != blank %}{{ section.settings.wehair_image | image_url: width: 1600 | image_tag: class: \'itt-editorial__media\', loading: \'lazy\', alt: "WE HAIR tools and beauty development" }}{% endif %}'
          )

          m = re.search(r'{% schema %}\s*(\{.*?\})\s*{% endschema %}', text, flags=re.S)
          if not m:
            raise SystemExit('schema not found')
          schema = json.loads(m.group(1))
          existing = {s.get('id') for s in schema.get('settings', [])}
          image_settings = [
            {"type":"header","content":"Campaign images"},
            {"type":"image_picker","id":"hero_image","label":"Hero image"},
            {"type":"image_picker","id":"apparel_image","label":"Apparel image"},
            {"type":"image_picker","id":"flagline_image","label":"GVO / FLAGLINE image"},
            {"type":"image_picker","id":"lab_image","label":"The Lab image"},
            {"type":"image_picker","id":"denim_image","label":"Custom Denim image"},
            {"type":"image_picker","id":"wehair_image","label":"WE HAIR image"},
          ]
          insert = [s for s in image_settings if s.get('id') not in existing or s.get('type') == 'header']
          schema['settings'] = insert + schema.get('settings', [])
          new_schema = json.dumps(schema, ensure_ascii=False, separators=(',', ':'))
          text = text[:m.start(1)] + new_schema + text[m.end(1):]

          # Add a clean neutral placeholder so missing selections never show broken icons.
          text = text.replace("{{ 'ittoldem-house.css' | asset_url | stylesheet_tag }}", "{{ 'ittoldem-house.css' | asset_url | stylesheet_tag }}\n<style>.itt-media-placeholder{display:block;background:linear-gradient(180deg,#ece8df 0%,#d7d1c7 100%);width:100%;height:100%;}</style>")
          p.write_text(text, encoding='utf-8')

      - name: Commit native Shopify image picker version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sections/ittoldem-house.liquid
          git diff --cached --quiet && exit 0
          git commit -m "Use native Shopify image pickers for campaign media"
          git push origin HEAD:ittoldem-commerce-pass
