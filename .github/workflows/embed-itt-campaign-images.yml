name: Build ITT embedded image snippets

on:
  push:
    branches:
      - ittoldem-commerce-pass
    paths:
      - .github/workflows/embed-itt-campaign-images.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ittoldem-commerce-pass

      - name: Build one data URI snippet per campaign image
        shell: python
        run: |
          from pathlib import Path
          import base64

          mapping = {
              'hero': 'assets/itt-new-hero.webp',
              'apparel': 'assets/itt-new-apparel.webp',
              'flagline': 'assets/itt-new-flagline.webp',
              'lab': 'assets/itt-new-lab.webp',
              'denim': 'assets/itt-new-denim.webp',
              'wehair': 'assets/itt-new-wehair.webp',
          }

          for key, filename in mapping.items():
              data = base64.b64encode(Path(filename).read_bytes()).decode('ascii')
              Path(f'snippets/itt-campaign-{key}.liquid').write_text(
                  'data:image/webp;base64,' + data,
                  encoding='utf-8'
              )

          home = Path('sections/ittoldem-house.liquid')
          text = home.read_text(encoding='utf-8')
          replacements = {
              "{{ 'itt-campaign-hero.svg' | asset_url }}": "{% render 'itt-campaign-hero' %}",
              "{{ 'itt-campaign-apparel.svg' | asset_url }}": "{% render 'itt-campaign-apparel' %}",
              "{{ 'itt-campaign-flagline.svg' | asset_url }}": "{% render 'itt-campaign-flagline' %}",
              "{{ 'itt-campaign-lab.svg' | asset_url }}": "{% render 'itt-campaign-lab' %}",
              "{{ 'itt-campaign-denim.svg' | asset_url }}": "{% render 'itt-campaign-denim' %}",
              "{{ 'itt-campaign-wehair.svg' | asset_url }}": "{% render 'itt-campaign-wehair' %}",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          home.write_text(text, encoding='utf-8')

          about = Path('sections/ittoldem-about.liquid')
          if about.exists():
              text = about.read_text(encoding='utf-8')
              text = text.replace("{{ 'itt-campaign-hero.svg' | asset_url }}", "{% render 'itt-campaign-hero' %}")
              about.write_text(text, encoding='utf-8')

          dest = Path('sections/ittoldem-destination.liquid')
          if dest.exists():
              text = dest.read_text(encoding='utf-8')
              text = text.replace("assign destination_image = 'itt-campaign-apparel.svg'", "assign destination_image = 'apparel'")
              text = text.replace("assign destination_image = 'itt-campaign-flagline.svg'", "assign destination_image = 'flagline'")
              text = text.replace("assign destination_image = 'itt-campaign-wehair.svg'", "assign destination_image = 'wehair'")
              text = text.replace("assign destination_image = 'itt-campaign-lab.svg'", "assign destination_image = 'lab'")
              text = text.replace("assign destination_image = 'itt-campaign-denim.svg'", "assign destination_image = 'denim'")
              text = text.replace("src=\"{{ destination_image | asset_url }}\"", "src=\"{% case destination_image %}{% when 'apparel' %}{% render 'itt-campaign-apparel' %}{% when 'flagline' %}{% render 'itt-campaign-flagline' %}{% when 'wehair' %}{% render 'itt-campaign-wehair' %}{% when 'lab' %}{% render 'itt-campaign-lab' %}{% when 'denim' %}{% render 'itt-campaign-denim' %}{% endcase %}\"")
              dest.write_text(text, encoding='utf-8')

      - name: Commit embedded campaign snippets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snippets/itt-campaign-*.liquid sections/ittoldem-house.liquid sections/ittoldem-about.liquid sections/ittoldem-destination.liquid
          git diff --cached --quiet && exit 0
          git commit -m "Render campaign images as separate embedded data URIs"
          git push origin HEAD:ittoldem-commerce-pass
