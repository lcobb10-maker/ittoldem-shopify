name: Shopify theme validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  theme-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Shopify Theme Check
        run: gem install theme-check --no-document
      - name: Check theme
        run: theme-check .
