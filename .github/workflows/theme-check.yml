name: ITT Storefront Validation

on:
  push:
    branches: [ittoldem-commerce-pass]
  pull_request:
    branches: [ittoldem-commerce-pass]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current commerce-pass homepage
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          required_dirs = ['assets','blocks','config','layout','locales','sections','snippets','templates']
          missing = [name for name in required_dirs if not (root / name).is_dir()]
          if missing:
              raise SystemExit(f'Missing required theme directories: {missing}')

          def strip_banner(text):
              return re.sub(r'^\s*/\*.*?\*/\s*', '', text, flags=re.S)

          for path in sorted([*root.glob('templates/*.json'), *root.glob('config/*.json'), *root.glob('sections/*.json')]):
              json.loads(strip_banner(path.read_text(encoding='utf-8')))

          homepage = json.loads(strip_banner((root / 'templates/index.json').read_text(encoding='utf-8')))
          sections = homepage.get('sections', {})
          order = homepage.get('order', [])

          assert sections.get('itt_home_experience', {}).get('type') == 'ittoldem-home-experience', 'Homepage must use the current ITT experience'
          assert sections.get('itt_falling_overlay', {}).get('type') == 'ittoldem-falling-overlay', 'Homepage must keep the falling house overlay'
          assert order == ['itt_home_experience', 'itt_falling_overlay'], 'Homepage order must contain the current experience and overlay'

          header = json.loads(strip_banner((root / 'sections/header-group.json').read_text(encoding='utf-8')))
          header_sections = header.get('sections', {})
          header_order = header.get('order', [])
          assert 'header_section' not in header_sections and 'header_section' not in header_order, 'Default Shopify header must not duplicate ITT navigation'
          assert header_sections.get('itt_house_navigation', {}).get('type') == 'ittoldem-global-nav', 'ITT house navigation missing'
          assert header_order == ['itt_house_navigation'], 'Header must contain only ITT navigation'

          experience = (root / 'sections/ittoldem-home-experience.liquid').read_text(encoding='utf-8')
          assert 'THE CURRENT' in experience and 'EDIT.' in experience, 'Homepage must keep the current House Edit'
          for handle in (
              '313-speed-series-tee-amp-jogger-set',
              'football-family-fan-jersey-youth',
              'football-family-fan-jersey-adult',
              'travel-ball-mom-dad-sublimated-polo',
          ):
              assert handle in experience, f'Featured product is missing from homepage: {handle}'
          assert 'preload="metadata"' in experience, 'Process films must avoid eager full-video loading'

          parallax = (root / 'assets/itt-horizontal-parallax.js').read_text(encoding='utf-8')
          assert 'ittHouseGatheringHandDrawnV1.png' in parallax, 'House world artwork is missing'
          assert 'ittFlaglineFieldHandDrawnV1.png' in parallax, 'Flagline world artwork is missing'
          assert 'ittLaboratoireMakerHandDrawnV1.png' in parallax, 'Laboratoire world artwork is missing'
          assert '.itt-has-megaworld>.itt-x__commerce' not in parallax, 'Menu hero must not hide the shoppable homepage'

          navigation = (root / 'sections/ittoldem-global-nav.liquid').read_text(encoding='utf-8')
          for handle in ('itt-girls-flag-football', "collections['custom']", "collections['the-lab']"):
              assert handle in navigation, f'Live collection route is missing: {handle}'

          deploy = (root / '.github/workflows/deploy-commerce-pass.yml').read_text(encoding='utf-8')
          assert 'workflow_dispatch:' in deploy, 'Manual deployment path must remain available'
          assert 'push:' not in deploy.split('workflow_dispatch:')[0], 'Shopify GitHub sync is the only automatic deployment path'

          conflict_re = re.compile(r'^(?:<<<<<<<|=======|>>>>>>>)', re.M)
          for folder in ('sections','blocks'):
              for path in sorted((root / folder).glob('*.liquid')):
                  text = path.read_text(encoding='utf-8')
                  for match in re.finditer(r'{% schema %}\s*(.*?)\s*{% endschema %}', text, re.S):
                      json.loads(match.group(1))
                  assert not conflict_re.search(text), f'Merge conflict marker in {path}'

          print('ITT TOLD’EM clean commerce-pass storefront validation passed.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Shopify Theme Check
        run: |
          npm install -g @shopify/cli@latest
          shopify theme check --path . --fail-level error --no-color
