name: ITT Storefront Validation

on:
  push:
    branches: [ittoldem-commerce-pass]
  pull_request:
    branches: [ittoldem-commerce-pass]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current commerce-pass homepage
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          required_dirs = ['assets','blocks','config','layout','locales','sections','snippets','templates']
          missing = [name for name in required_dirs if not (root / name).is_dir()]
          if missing:
              raise SystemExit(f'Missing required theme directories: {missing}')

          def strip_banner(text):
              return re.sub(r'^\s*/\*.*?\*/\s*', '', text, flags=re.S)

          for path in sorted([*root.glob('templates/*.json'), *root.glob('config/*.json'), *root.glob('sections/*.json')]):
              json.loads(strip_banner(path.read_text(encoding='utf-8')))

          homepage = json.loads(strip_banner((root / 'templates/index.json').read_text(encoding='utf-8')))
          sections = homepage.get('sections', {})
          order = homepage.get('order', [])

          assert sections.get('ittoldem_house', {}).get('type') == 'ittoldem-house-v2', 'Homepage must use ittoldem-house-v2'
          assert sections.get('itt_media_field', {}).get('type') == 'ittoldem-media-field', 'Homepage must include the asymmetric ITT media field'
          assert 'itt_media_field' in order, 'ITT media field must be in homepage order'
          assert 'itt_watch_four' not in order, 'Legacy four-video wall must not be in homepage order'
          assert sections.get('itt_custom_studio', {}).get('type') == 'ittoldem-custom-studio', 'Custom studio section missing'

          media = (root / 'sections/ittoldem-media-field.liquid').read_text(encoding='utf-8')
          assert 'stop(v)' in media or 'videos.forEach' in media, 'Media field must prevent simultaneous playback'
          assert 'VIEW MOTION' in media, 'Media field requires deliberate playback control'
          assert 'prefers-reduced-motion' in media, 'Media field must respect reduced motion'

          house = (root / 'sections/ittoldem-house-v2.liquid').read_text(encoding='utf-8')
          assert '82svh' not in house, 'Oversized 82svh hero returned'

          for folder in ('sections','blocks'):
              for path in sorted((root / folder).glob('*.liquid')):
                  text = path.read_text(encoding='utf-8')
                  for match in re.finditer(r'{% schema %}\s*(.*?)\s*{% endschema %}', text, re.S):
                      json.loads(match.group(1))
                  for marker in ['<<<<<<<','=======','>>>>>>>']:
                      assert marker not in text, f'Merge conflict marker in {path}'

          print('ITT TOLD’EM commerce-pass storefront validation passed.')
          PY
