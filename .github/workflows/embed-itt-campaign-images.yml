name: Build ITT campaign SVG assets

on:
  push:
    branches:
      - ittoldem-commerce-pass
    paths:
      - .github/workflows/embed-itt-campaign-images.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ittoldem-commerce-pass

      - name: Convert binary campaign images into text SVG assets
        shell: python
        run: |
          from pathlib import Path
          import base64

          mapping = {
              'hero': ('assets/itt-new-hero.webp', 900, 620),
              'apparel': ('assets/itt-new-apparel.webp', 600, 800),
              'flagline': ('assets/itt-new-flagline.webp', 600, 800),
              'lab': ('assets/itt-new-lab.webp', 600, 800),
              'denim': ('assets/itt-new-denim.webp', 600, 800),
              'wehair': ('assets/itt-new-wehair.webp', 600, 800),
          }

          for key, (filename, width, height) in mapping.items():
              data = base64.b64encode(Path(filename).read_bytes()).decode('ascii')
              svg = (
                  f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {width} {height}" '
                  f'preserveAspectRatio="xMidYMid slice">'
                  f'<image href="data:image/webp;base64,{data}" width="{width}" height="{height}" '
                  f'preserveAspectRatio="xMidYMid slice"/></svg>'
              )
              Path(f'assets/itt-campaign-{key}.svg').write_text(svg, encoding='utf-8')

          home = Path('sections/ittoldem-house.liquid')
          text = home.read_text(encoding='utf-8')
          replacements = {
              "{% render 'itt-campaign-image', key: 'hero' %}": "{{ 'itt-campaign-hero.svg' | asset_url }}",
              "{% render 'itt-campaign-image', key: 'apparel' %}": "{{ 'itt-campaign-apparel.svg' | asset_url }}",
              "{% render 'itt-campaign-image', key: 'flagline' %}": "{{ 'itt-campaign-flagline.svg' | asset_url }}",
              "{% render 'itt-campaign-image', key: 'lab' %}": "{{ 'itt-campaign-lab.svg' | asset_url }}",
              "{% render 'itt-campaign-image', key: 'denim' %}": "{{ 'itt-campaign-denim.svg' | asset_url }}",
              "{% render 'itt-campaign-image', key: 'wehair' %}": "{{ 'itt-campaign-wehair.svg' | asset_url }}",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          home.write_text(text, encoding='utf-8')

          about = Path('sections/ittoldem-about.liquid')
          if about.exists():
              text = about.read_text(encoding='utf-8')
              text = text.replace("{% render 'itt-campaign-image', key: 'hero' %}", "{{ 'itt-campaign-hero.svg' | asset_url }}")
              about.write_text(text, encoding='utf-8')

          dest = Path('sections/ittoldem-destination.liquid')
          if dest.exists():
              text = dest.read_text(encoding='utf-8')
              text = text.replace("assign destination_image = 'apparel'", "assign destination_image = 'itt-campaign-apparel.svg'")
              text = text.replace("assign destination_image = 'flagline'", "assign destination_image = 'itt-campaign-flagline.svg'")
              text = text.replace("assign destination_image = 'wehair'", "assign destination_image = 'itt-campaign-wehair.svg'")
              text = text.replace("assign destination_image = 'lab'", "assign destination_image = 'itt-campaign-lab.svg'")
              text = text.replace("assign destination_image = 'denim'", "assign destination_image = 'itt-campaign-denim.svg'")
              text = text.replace("src=\"{% render 'itt-campaign-image', key: destination_image %}\"", "src=\"{{ destination_image | asset_url }}\"")
              dest.write_text(text, encoding='utf-8')

      - name: Commit SVG campaign assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/itt-campaign-*.svg sections/ittoldem-house.liquid sections/ittoldem-about.liquid sections/ittoldem-destination.liquid
          git diff --cached --quiet && exit 0
          git commit -m "Use text SVG campaign assets for Shopify sync"
          git push origin HEAD:ittoldem-commerce-pass
